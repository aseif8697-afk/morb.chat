    <meta name="description" content="سجّل دخولك إلى شات مرعب برقم هاتفك عبر كود تحقق SMS." />

            justify-content: center;
            align-items: center;
            padding: 20px;

            max-width: 420px;
            width: 100%;

            background: rgba(12, 12, 12, 0.92);
            border-radius: 24px;

        }
        .logo-container { text-align: center; margin-bottom: 28px; }

            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #fff;
            padding: 0 12px;
            font-size: 15px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            white-space: nowrap;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.06);

            align-items: center;
        }

            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 14px 12px;
            font-size: 16px;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }
        .input-group input::placeholder { color: #555; }
        .input-wrap { margin: 12px 0 16px; }

            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #b026ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;

            margin-top: 6px;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            font-family: 'Cairo', sans-serif;

        .auth-footer { text-align: center; margin-top: 22px; color: #555; font-size: 13px; }
        .auth-footer a { color: #00d4ff; text-decoration: none; font-weight: 600; cursor: pointer; }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: white;
            border-radius: 50%;

            display: none;
            justify-content: center; align-items: flex-end;

                    const item = document.createElement('div');
                    item.className = 'country-item';
                    item.innerHTML = `<span class="flag">${flagEmoji(iso)}</span><span class="name">${name}</span><span class="dial">+${dial}</span>`;
                    item.onclick = () => {
                        selectedCountry = [iso, dial, name];
                        selectedFlag.textContent = flagEmoji(iso);
                        selectedDial.textContent = '+' + dial;
                        countryOverlay.classList.remove('open');
                        phoneInput.focus();
                    };
                    countryList.appendChild(item);
                });
        }
        countryBtn.onclick = () => { renderCountries(); countrySearch.value = ''; countryOverlay.classList.add('open'); countrySearch.focus(); };
        countrySearch.oninput = () => renderCountries(countrySearch.value);
        countryOverlay.onclick = (e) => { if (e.target === countryOverlay) countryOverlay.classList.remove('open'); };

        // ===== reCAPTCHA =====
        function getRecaptcha() {
            if (!recaptchaVerifier) {
                recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
            }
            return recaptchaVerifier;
        }
        function resetRecaptcha() {
            try { if (recaptchaVerifier) recaptchaVerifier.clear(); } catch (e) {}
            recaptchaVerifier = null;
        }

        // ===== رسائل الأخطاء =====
        function authErrorMessage(error, fallback) {
            const messages = {
                'auth/invalid-phone-number': '⚠️ رقم الهاتف غير صحيح، تأكد من الرقم والدولة',
                'auth/missing-phone-number': '⚠️ أدخل رقم الهاتف أولًا',
                'auth/quota-exceeded': '⚠️ تم تجاوز حد الرسائل اليومي، حاول لاحقًا',
                'auth/too-many-requests': '⚠️ محاولات كثيرة؛ انتظر قليلًا ثم حاول مجددًا',
                'auth/invalid-verification-code': '⚠️ الكود غير صحيح، تأكد وحاول مرة أخرى',
                'auth/code-expired': '⚠️ انتهت صلاحية الكود، اطلب كودًا جديدًا',
                'auth/network-request-failed': '⚠️ تعذر الاتصال بالإنترنت، حاول مرة أخرى',
                'auth/operation-not-allowed': '⚠️ تسجيل الدخول بالهاتف غير مفعّل',
                'auth/captcha-check-failed': '⚠️ فشل التحقق الأمني، أعد تحميل الصفحة وحاول مجددًا',
                'auth/invalid-app-credential': '⚠️ فشل التحقق الأمني، أعد تحميل الصفحة'
            };
            return messages[error?.code] || `⚠️ ${fallback}`;
        }

        function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }
        function hideError(el) { el.style.display = 'none'; }

        // ===== إرسال الكود =====
        async function sendCode() {
            hideError(phoneError);
            const digits = phoneInput.value.replace(/\D/g, '').replace(/^0+/, '');
            if (!digits || digits.length < 6 || digits.length > 12) {
                showError(phoneError, '⚠️ أدخل رقم هاتف صحيح بدون صفر البداية');
                return;
            }
            const fullNumber = `+${selectedCountry[1]}${digits}`;

            sendCodeBtn.disabled = true;
            sendSpinner.style.display = 'inline-block';

            try {
                confirmationResult = await signInWithPhoneNumber(auth, fullNumber, getRecaptcha());
                otpSentTo.textContent = `أرسلنا كودًا مكونًا من 6 أرقام إلى ${fullNumber}`;
                otpBoxes.forEach((b) => (b.value = ''));
                showStep('otp');
                otpBoxes[0].focus();
                startResendTimer();
            } catch (error) {
                console.error('Send Code Error:', error);
                showError(phoneError, authErrorMessage(error, 'فشل إرسال كود التحقق'));
                resetRecaptcha();
            } finally {
                sendCodeBtn.disabled = false;
                sendSpinner.style.display = 'none';
            }
        }
        sendCodeBtn.onclick = sendCode;
        phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCode(); });

        // ===== خانات OTP =====
        otpBoxes.forEach((box, i) => {
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '').slice(0, 1);
                if (box.value && i < 5) otpBoxes[i + 1].focus();
                const code = otpBoxes.map((b) => b.value).join('');
                if (code.length === 6) confirmCode(code);
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && i > 0) otpBoxes[i - 1].focus();
            });
            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                pasted.split('').forEach((ch, j) => { if (otpBoxes[j]) otpBoxes[j].value = ch; });
                if (pasted.length === 6) confirmCode(pasted);
                else if (pasted.length) otpBoxes[Math.min(pasted.length, 5)].focus();
            });
        });

        // ===== تأكيد الكود =====
        async function confirmCode(codeFromInput) {
            hideError(otpError);
            const code = codeFromInput || otpBoxes.map((b) => b.value).join('');
            if (code.length !== 6) {
                showError(otpError, '⚠️ أدخل الكود المكون من 6 أرقام كاملًا');
                return;
            }
            if (!confirmationResult) {
                showError(otpError, '⚠️ انتهت الجلسة، أعد إرسال الكود');
                return;
            }
            confirmCodeBtn.disabled = true;
            confirmSpinner.style.display = 'inline-block';
            try {
                await confirmationResult.confirm(code);
                // onAuthStateChanged سيتولى الباقي
            } catch (error) {
                console.error('Confirm Error:', error);
                showError(otpError, authErrorMessage(error, 'فشل تأكيد الكود'));
                confirmCodeBtn.disabled = false;
                confirmSpinner.style.display = 'none';
            }
        }
        confirmCodeBtn.onclick = () => confirmCode();

        // ===== مؤقت إعادة الإرسال =====
        function startResendTimer() {
            clearInterval(resendInterval);
            let seconds = 60;
            resendTimer.textContent = seconds;
            resendLink.classList.add('disabled');
            resendInterval = setInterval(() => {
                seconds--;
                resendTimer.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(resendInterval);
                    resendLink.classList.remove('disabled');
                    resendLink.textContent = 'إعادة الإرسال الآن';
                }
            }, 1000);
        }
        resendLink.onclick = async () => {
            if (resendLink.classList.contains('disabled')) return;
            resendLink.innerHTML = `إعادة الإرسال (<span id="resendTimer">60</span>)`;
            // إعادة استخدام نفس الرقم
            showStep('phone');
            await sendCode();
        };
        changeNumberLink.onclick = () => {
            clearInterval(resendInterval);
            confirmationResult = null;
            resetRecaptcha();
            showStep('phone');
        };

        // ===== حفظ الاسم =====
        saveNameBtn.onclick = async () => {
            hideError(nameError);
            const name = nameInput.value.trim();
            if (name.length < 2) {
                showError(nameError, '⚠️ أدخل اسمًا صحيحًا (حرفان على الأقل)');
                return;
            }
            const user = auth.currentUser;
            if (!user) { showError(nameError, '⚠️ انتهت الجلسة، أعد تسجيل الدخول'); return; }

            saveNameBtn.disabled = true;
            nameSpinner.style.display = 'inline-block';
            try {
                await updateProfile(user, { displayName: name });
                await setDoc(doc(db, 'users', user.uid), {
                    displayName: name,
                    phone: user.phoneNumber || '',
                    email: '',
                    photoURL: '',
                    isVerified: true,
                    isAdmin: false,
                    isBanned: false,
                    trustScore: 100,
                    createdAt: serverTimestamp(),
                    lastActive: serverTimestamp()
                }, { merge: true });
                goToDashboard();
            } catch (error) {
                console.error('Save Name Error:', error);
                showError(nameError, '⚠️ فشل حفظ الاسم، حاول مرة أخرى');
                saveNameBtn.disabled = false;
                nameSpinner.style.display = 'none';
            }
        };
        nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveNameBtn.click(); });

        // ===== التحويل للوحة =====
        function goToDashboard() {
            showStep('welcome');
            let progress = 0;
            const interval = setInterval(() => {
                progress += 4;
                loadingProgress.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    window.location.href = 'dashboard.html';
                }
            }, 40);
        }

        // ===== مراقبة حالة الدخول =====
        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            try {
                const snap = await getDoc(doc(db, 'users', user.uid));
                const hasName = user.displayName || (snap.exists() && snap.data().displayName);
                if (snap.exists()) {
                    setDoc(doc(db, 'users', user.uid), { lastActive: serverTimestamp() }, { merge: true }).catch(() => {});
                }
                if (hasName) goToDashboard();
                else showStep('name');
            } catch (error) {
                console.warn('تعذر فحص الملف الشخصي:', error);
                if (user.displayName) goToDashboard();
                else showStep('name');
            }
        });
    </script>
</body>
</html>
