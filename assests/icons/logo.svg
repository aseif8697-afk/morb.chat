<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff" />
      <stop offset="100%" style="stop-color:#b026ff" />
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b026ff" />
      <stop offset="100%" style="stop-color:#ff0080" />
    </linearGradient>
  </defs>
  
  <!-- خلفية الدائرة -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0a" stroke="url(#logoGrad)" stroke-width="2"/>
  
  <!-- دائرة نيون خارجية -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.3"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#logoGrad2)" stroke-width="1" opacity="0.2"/>
  
  <!-- حرف م (مرعب) -->
  <text x="50" y="62" font-size="40" text-anchor="middle" fill="url(#logoGrad)" font-family="Arial, sans-serif" font-weight="bold">
    M
  </text>
  
  <!-- تأثير نيون -->
  <text x="50" y="62" font-size="40" text-anchor="middle" fill="url(#logoGrad)" font-family="Arial, sans-serif" font-weight="bold" opacity="0.3" filter="blur(4px)">
    M
  </text>
</svg>
