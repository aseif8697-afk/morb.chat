<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>شات مرعب - لوحة المحادثات</title>
    
    <link rel="stylesheet" href="CSS/main.css" />
    <link rel="stylesheet" href="CSS/neon-theme.css" />
    <link rel="stylesheet" href="CSS/dashboard.css" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.18.0/dist/index.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="dashboard-container">

        <!-- ===== الهيدر ===== -->
        <header class="dashboard-header">
            <div class="header-left">
                <img src="assets/icons/logo.svg" alt="شات مرعب" class="small-logo" onerror="this.style.display='none'" />
                <h1 class="header-title">شات مرعب</h1>
            </div>
            <div class="header-right">
                <div class="user-profile" id="userProfile">
                    <img src="" alt="Profile" class="profile-avatar" id="profileAvatar" />
                    <span class="user-name" id="userNameDisplay">مستخدم</span>
                    <span class="user-status" id="userStatus">🟢 متصل</span>
                </div>
                <button id="settingsBtn" class="btn-settings">⚙️</button>
                <button id="logoutBtn" class="btn-logout">🚪</button>
            </div>
        </header>

        <!-- ===== المحتوى الرئيسي ===== -->
        <div class="dashboard-body">

            <!-- ===== القائمة الجانبية ===== -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>📋 المحادثات</h3>
                    <button id="newGroupBtn" class="btn-new-group">➕</button>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="🔍 بحث أو بدء محادثة جديدة..." />
                </div>
                
                <div class="chat-list" id="chatList">
                    <div class="loading-chats">جاري تحميل المحادثات...</div>
                </div>
            </aside>

            <!-- ===== نافذة الدردشة ===== -->
            <main class="chat-window" id="chatWindow">
                
                <!-- رأس المحادثة -->
                <div class="chat-header" id="chatHeader">
                    <div class="chat-header-info">
                        <img src="" alt="Chat" class="chat-avatar" id="chatAvatar" />
                        <div>
                            <div class="chat-name-wrapper">
                                <span class="chat-name" id="chatName">اختر محادثة</span>
                                <span class="verified-badge" id="verifiedBadge" style="display: none;"></span>
                            </div>
                            <span class="chat-status" id="chatStatus">🟢 متصل</span>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button id="callBtn" class="btn-call">📞</button>
                        <button id="videoCallBtn" class="btn-video">📹</button>
                        <button id="chatMenuBtn" class="btn-menu">⋮</button>
                    </div>
                </div>

                <!-- منطقة الرسائل -->
                <div class="messages-area" id="messagesArea">
                    <div class="empty-chat">💬 اختر محادثة لتبدأ الدردشة</div>
                </div>

                <!-- ===== منطقة الإرسال ===== -->
                <div class="input-area" id="inputArea">
                    <div class="input-tools">
                        <button id="emojiBtn" class="btn-tool">😊</button>
                        <button id="stickerBtn" class="btn-tool">✨</button>
                        <button id="customEmojiBtn" class="btn-tool">🎨</button>
                        <button id="attachBtn" class="btn-tool">📎</button>
                        <button id="voiceBtn" class="btn-tool">🎤</button>
                    </div>
                    
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="اكتب رسالة..." />
                    </div>
                    
                    <button id="sendBtn" class="btn-send">➤</button>
                </div>

                <!-- ===== صف الإيموجي السريع ===== -->
                <div class="emoji-quick-bar" id="emojiQuickBar">
                    <span onclick="insertEmoji('😊')">😊</span>
                    <span onclick="insertEmoji('❤️')">❤️</span>
                    <span onclick="insertEmoji('🔥')">🔥</span>
                    <span onclick="insertEmoji('😂')">😂</span>
                    <span onclick="insertEmoji('😍')">😍</span>
                    <span onclick="insertEmoji('👍')">👍</span>
                    <span onclick="insertEmoji('👋')">👋</span>
                    <span onclick="insertEmoji('🎉')">🎉</span>
                    <span onclick="insertEmoji('💯')">💯</span>
                    <span onclick="insertEmoji('🤔')">🤔</span>
                    <span onclick="insertEmoji('😢')">😢</span>
                    <span onclick="insertEmoji('😡')">😡</span>
                </div>

                <!-- ===== نافذة الإيموجي الكاملة ===== -->
                <div class="emoji-picker-container" id="emojiPickerContainer" style="display: none;">
                    <div id="emojiPicker"></div>
                </div>

            </main>
        </div>

        <!-- ===== باقي النوافذ (مودالات) ===== -->
        <!-- ===== نافذة إنشاء جروب ===== -->
        <div class="modal-overlay" id="groupModal" style="display: none;">
            <div class="modal-content">
                <h2>إنشاء جروب جديد</h2>
                <input type="text" id="groupNameInput" placeholder="اسم الجروب..." />
                <input type="text" id="groupMembersInput" placeholder="أرقام الأعضاء (مفصولة بفاصلة)..." />
                <div class="modal-buttons">
                    <button id="createGroupBtn" class="btn-primary">إنشاء</button>
                    <button id="closeModalBtn" class="btn-secondary">إلغاء</button>
                </div>
            </div>
        </div>

        <!-- ===== نافذة الإعدادات ===== -->
        <div class="modal-overlay" id="settingsModal" style="display: none;">
            <div class="modal-content settings-modal">
                <h2>⚙️ الإعدادات</h2>
                
                <div class="settings-section">
                    <label>اسم المستخدم</label>
                    <input type="text" id="settingsNameInput" />
                    <button id="saveNameBtn" class="btn-primary">حفظ</button>
                </div>
                
                <div class="settings-section">
                    <label>صورة البروفايل</label>
                    <input type="file" id="settingsPhotoInput" accept="image/*" />
                    <button id="savePhotoBtn" class="btn-primary">رفع</button>
                </div>
                
                <div class="settings-section">
                    <label>حالة المستخدم</label>
                    <select id="settingsStatusSelect">
                        <option value="online">🟢 متصل</option>
                        <option value="away">🟡 غير متصل</option>
                        <option value="busy">🔴 مشغول</option>
                    </select>
                </div>
                
                <div class="settings-section">
                    <label>🔮 الإيموجي المخصص (قريباً)</label>
                    <p class="text-muted">⭐ سيتم تفعيلها مع الاشتراك المميز</p>
                </div>
                
                <div class="modal-buttons">
                    <button id="closeSettingsBtn" class="btn-secondary">إغلاق</button>
                </div>
            </div>
        </div>

        <!-- ===== نافذة معاينة الملفات ===== -->
        <div class="modal-overlay" id="filePreviewModal" style="display: none;">
            <div class="modal-content preview-modal">
                <h2>📎 معاينة الملف</h2>
                <div id="filePreviewContent"></div>
                <div class="modal-buttons">
                    <button id="sendFileBtn" class="btn-primary">إرسال</button>
                    <button id="closePreviewBtn" class="btn-secondary">إلغاء</button>
                </div>
            </div>
        </div>

        <!-- ===== نافذة تسجيل صوتي ===== -->
        <div class="modal-overlay" id="voiceModal" style="display: none;">
            <div class="modal-content voice-modal">
                <h2>🎤 تسجيل صوتي</h2>
                <div class="voice-recorder">
                    <div class="voice-wave" id="voiceWave">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </div>
                    <div class="voice-timer" id="voiceTimer">00:00</div>
                    <div class="voice-buttons">
                        <button id="startRecordBtn" class="btn-primary">🔴 بدء التسجيل</button>
                        <button id="stopRecordBtn" class="btn-secondary" style="display: none;">⏹️ إيقاف</button>
                        <button id="sendVoiceBtn" class="btn-primary" style="display: none;">📤 إرسال</button>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button id="closeVoiceBtn" class="btn-secondary">إلغاء</button>
                </div>
            </div>
        </div>

        <!-- ===== نافذة الملصقات ===== -->
        <div class="modal-overlay" id="stickerModal" style="display: none;">
            <div class="modal-content sticker-modal">
                <h2>✨ الملصقات</h2>
                
                <div class="sticker-tabs">
                    <button class="sticker-tab active" data-tab="suggested">📦 المقترحة</button>
                    <button class="sticker-tab" data-tab="custom">🎨 المخصصة</button>
                    <button class="sticker-tab" data-tab="favorites">⭐ المفضلة</button>
                </div>
                
                <div class="sticker-content" id="stickerContent">
                    <div class="loading-chats">جاري تحميل الملصقات...</div>
                </div>
                
                <div class="sticker-upload">
                    <input type="file" id="stickerUploadInput" accept="image/*" />
                    <button id="uploadStickerBtn" class="btn-primary">📤 رفع ملصق</button>
                </div>
                
                <div class="modal-buttons">
                    <button id="closeStickerBtn" class="btn-secondary">إغلاق</button>
                </div>
            </div>
        </div>

        <!-- ===== نافذة إنشاء إيموجي مخصص ===== -->
        <div class="modal-overlay" id="customEmojiModal" style="display: none;">
            <div class="modal-content emoji-modal">
                <h2>🎨 إنشاء إيموجي مخصص</h2>
                
                <div class="emoji-creator">
                    <div class="emoji-preview" id="emojiPreview">😊</div>
                    
                    <div class="emoji-controls">
                        <label>اختر صورة</label>
                        <input type="file" id="emojiImageInput" accept="image/*" />
                        
                        <label>اختر خلفية</label>
                        <div class="emoji-colors">
                            <span class="color-option active" data-color="transparent" style="background: transparent; border: 1px solid #ddd;">🔲</span>
                            <span class="color-option" data-color="#ff6b6b" style="background: #ff6b6b;"></span>
                            <span class="color-option" data-color="#ffd93d" style="background: #ffd93d;"></span>
                            <span class="color-option" data-color="#6bcb77" style="background: #6bcb77;"></span>
                            <span class="color-option" data-color="#4d96ff" style="background: #4d96ff;"></span>
                            <span class="color-option" data-color="#ff6bff" style="background: #ff6bff;"></span>
                        </div>
                        
                        <label>اسم الإيموجي</label>
                        <input type="text" id="emojiNameInput" placeholder="مثال: وجه_سعيد" />
                    </div>
                </div>
                
                <div class="modal-buttons">
                    <button id="saveEmojiBtn" class="btn-primary">💾 حفظ</button>
                    <button id="closeEmojiBtn" class="btn-secondary">إلغاء</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== جافاسكريبت ===== -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js",
                "emoji-picker-element": "https://cdn.jsdelivr.net/npm/emoji-picker-element@1.18.0/index.js"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // استيراد Firebase
        // ============================================================
        import { initializeApp } from "firebase/app";
        import {
            getAuth,
            onAuthStateChanged,
            signOut,
            updateProfile
        } from "firebase/auth";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDoc,
            getDocs,
            query,
            where,
            orderBy,
            onSnapshot,
            addDoc,
            serverTimestamp,
            updateDoc,
            arrayUnion,
            arrayRemove,
            deleteDoc,
            writeBatch
        } from "firebase/firestore";
        import {
            getStorage,
            ref,
            uploadBytes,
            getDownloadURL,
            uploadBytesResumable
        } from "firebase/storage";
        
        import { Picker } from 'emoji-picker-element';

        // ============================================================
        // إعدادات Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCsL5cDqM4G7htK1k2qS7zC2YYGRJK6UbQ",
            authDomain: "morb-1cf55.firebaseapp.com",
            projectId: "morb-1cf55",
            storageBucket: "morb-1cf55.firebasestorage.app",
            messagingSenderId: "462602603099",
            appId: "1:462602603099:web:f377fcd79b88a2a7b84d7e",
            measurementId: "G-W4RG2RG9J6"
        };

        // ============================================================
        // تهيئة Firebase
        // ============================================================
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // ============================================================
        // متغيرات عامة
        // ============================================================
        let currentUser = null;
        let currentUserData = null;
        let currentChatId = null;
        let currentChatData = null;
        let unsubscribeMessages = null;
        let typingTimeout = null;
        let isTyping = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedAudio = null;
        let selectedFiles = [];

        // ============================================================
        // عناصر DOM
        // ============================================================
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userStatus = document.getElementById('userStatus');
        const profileAvatar = document.getElementById('profileAvatar');
        const logoutBtn = document.getElementById('logoutBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const chatList = document.getElementById('chatList');
        const chatName = document.getElementById('chatName');
        const chatStatus = document.getElementById('chatStatus');
        const chatAvatar = document.getElementById('chatAvatar');
        const verifiedBadge = document.getElementById('verifiedBadge');
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const emojiBtn = document.getElementById('emojiBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const stickerBtn = document.getElementById('stickerBtn');
        const customEmojiBtn = document.getElementById('customEmojiBtn');
        const searchInput = document.getElementById('searchInput');
        const newGroupBtn = document.getElementById('newGroupBtn');
        const groupModal = document.getElementById('groupModal');
        const groupNameInput = document.getElementById('groupNameInput');
        const groupMembersInput = document.getElementById('groupMembersInput');
        const createGroupBtn = document.getElementById('createGroupBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const settingsModal = document.getElementById('settingsModal');
        const settingsNameInput = document.getElementById('settingsNameInput');
        const saveNameBtn = document.getElementById('saveNameBtn');
        const settingsPhotoInput = document.getElementById('settingsPhotoInput');
        const savePhotoBtn = document.getElementById('savePhotoBtn');
        const settingsStatusSelect = document.getElementById('settingsStatusSelect');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const callBtn = document.getElementById('callBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const chatMenuBtn = document.getElementById('chatMenuBtn');
        const emojiPickerContainer = document.getElementById('emojiPickerContainer');
        const emojiPicker = document.getElementById('emojiPicker');
        const filePreviewModal = document.getElementById('filePreviewModal');
        const filePreviewContent = document.getElementById('filePreviewContent');
        const sendFileBtn = document.getElementById('sendFileBtn');
        const closePreviewBtn = document.getElementById('closePreviewBtn');
        const voiceModal = document.getElementById('voiceModal');
        const startRecordBtn = document.getElementById('startRecordBtn');
        const stopRecordBtn = document.getElementById('stopRecordBtn');
        const sendVoiceBtn = document.getElementById('sendVoiceBtn');
        const closeVoiceBtn = document.getElementById('closeVoiceBtn');
        const voiceTimer = document.getElementById('voiceTimer');
        const voiceWave = document.getElementById('voiceWave');
        const stickerModal = document.getElementById('stickerModal');
        const stickerContent = document.getElementById('stickerContent');
        const stickerUploadInput = document.getElementById('stickerUploadInput');
        const uploadStickerBtn = document.getElementById('uploadStickerBtn');
        const closeStickerBtn = document.getElementById('closeStickerBtn');
        const customEmojiModal = document.getElementById('customEmojiModal');
        const emojiImageInput = document.getElementById('emojiImageInput');
        const emojiNameInput = document.getElementById('emojiNameInput');
        const saveEmojiBtn = document.getElementById('saveEmojiBtn');
        const closeEmojiBtn = document.getElementById('closeEmojiBtn');
        const emojiPreview = document.getElementById('emojiPreview');

        // ============================================================
        // 1. مراقبة حالة المستخدم
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;
            
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (userDoc.exists()) {
                currentUserData = userDoc.data();
                updateUserUI(currentUserData);
                await updateUserStatus('online');
                loadChats();
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        // 2. دوال الواجهة الأساسية
        // ============================================================
        function updateUserUI(data) {
            userNameDisplay.textContent = data.displayName || 'مستخدم';
            profileAvatar.src = data.photoURL || 'assets/images/default-avatar.png';
            settingsNameInput.value = data.displayName || '';
            settingsStatusSelect.value = data.status || 'online';
        }

        async function updateUserStatus(status) {
            if (!currentUser) return;
            try {
                await updateDoc(doc(db, 'users', currentUser.uid), {
                    status: status,
                    lastSeen: serverTimestamp()
                });
            } catch (error) {
                console.error('❌ خطأ في تحديث الحالة:', error);
            }
        }

        // ============================================================
        // 3. تسجيل الخروج
        // ============================================================
        logoutBtn.addEventListener('click', async () => {
            try {
                await updateUserStatus('offline');
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('❌ خطأ في تسجيل الخروج:', error);
            }
        });

        // ============================================================
        // 4. الإعدادات
        // ============================================================
        settingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveNameBtn.addEventListener('click', async () => {
            const newName = settingsNameInput.value.trim();
            if (!newName) {
                alert('⚠️ الرجاء إدخال اسم');
                return;
            }

            try {
                await updateDoc(doc(db, 'users', currentUser.uid), {
                    displayName: newName
                });
                await updateProfile(auth.currentUser, {
                    displayName: newName
                });
                currentUserData.displayName = newName;
                updateUserUI(currentUserData);
                alert('✅ تم تحديث الاسم بنجاح');
                settingsModal.style.display = 'none';
            } catch (error) {
                console.error('❌ خطأ في تحديث الاسم:', error);
                alert('فشل تحديث الاسم');
            }
        });

        savePhotoBtn.addEventListener('click', async () => {
            const file = settingsPhotoInput.files[0];
            if (!file) {
                alert('⚠️ الرجاء اختيار صورة');
                return;
            }

            try {
                const storageRef = ref(storage, `avatars/${currentUser.uid}`);
                await uploadBytes(storageRef, file);
                const photoURL = await getDownloadURL(storageRef);
                
                await updateDoc(doc(db, 'users', currentUser.uid), {
                    photoURL: photoURL
                });
                await updateProfile(auth.currentUser, {
                    photoURL: photoURL
                });
                currentUserData.photoURL = photoURL;
                updateUserUI(currentUserData);
                alert('✅ تم تحديث الصورة بنجاح');
                settingsModal.style.display = 'none';
            } catch (error) {
                console.error('❌ خطأ في رفع الصورة:', error);
                alert('فشل رفع الصورة');
            }
        });

        settingsStatusSelect.addEventListener('change', async () => {
            const status = settingsStatusSelect.value;
            await updateUserStatus(status);
            userStatus.textContent = status === 'online' ? '🟢 متصل' : '🔴 غير متصل';
        });

        // ============================================================
        // 5. تحميل قائمة المحادثات (مع الشارة الزرقاء)
        // ============================================================
        function loadChats() {
            if (!currentUser) return;

            const chatsRef = collection(db, 'chats');
            const q = query(
                chatsRef,
                where('participants', 'array-contains', currentUser.uid),
                orderBy('lastMessageTime', 'desc')
            );

            onSnapshot(q, async (snapshot) => {
                chatList.innerHTML = '';
                
                if (snapshot.empty) {
                    chatList.innerHTML = `
                        <div class="empty-chats">
                            🗨️ لا توجد محادثات<br />
                            <small>ابحث عن مستخدمين لبدء الدردشة</small>
                        </div>
                    `;
                    return;
                }

                for (const docSnap of snapshot.docs) {
                    const chatData = docSnap.data();
                    const chatId = docSnap.id;
                    
                    let chatNameText = '';
                    let chatAvatarSrc = '';
                    let otherUserData = null;
                    
                    if (chatData.type === 'private') {
                        const otherId = chatData.participants.find(id => id !== currentUser.uid);
                        if (otherId) {
                            const userDoc = await getDoc(doc(db, 'users', otherId));
                            if (userDoc.exists()) {
                                otherUserData = userDoc.data();
                                chatNameText = otherUserData.displayName || 'مستخدم';
                                chatAvatarSrc = otherUserData.photoURL || '';
                            }
                        }
                    } else {
                        chatNameText = chatData.name || 'جروب';
                        chatAvatarSrc = '👥';
                    }

                    const chatItem = document.createElement('div');
                    chatItem.className = `chat-item ${chatId === currentChatId ? 'active' : ''}`;
                    chatItem.innerHTML = `
                        <div class="chat-avatar">
                            ${chatAvatarSrc ? `<img src="${chatAvatarSrc}" alt="${chatNameText}" />` : '👤'}
                        </div>
                        <div class="chat-info">
                            <div class="chat-name-wrapper">
                                <span class="chat-name">${chatNameText}</span>
                                ${otherUserData?.isVerified ? `<span class="verified-badge-small"></span>` : ''}
                            </div>
                            <div class="chat-last-msg">${chatData.lastMessage || 'ابدأ المحادثة'}</div>
                        </div>
                        <div class="chat-time">
                            ${chatData.lastMessageTime ? formatTime(chatData.lastMessageTime) : ''}
                        </div>
                    `;
                    
                    chatItem.addEventListener('click', () => {
                        openChat(chatId, chatData, otherUserData);
                    });
                    
                    chatList.appendChild(chatItem);
                }
            });
        }

        // ============================================================
        // 6. فتح محادثة (مع الشارة الزرقاء في الرأس)
        // ============================================================
        function openChat(chatId, chatData, otherUserData = null) {
            currentChatId = chatId;
            currentChatData = chatData;
            
            let chatNameText = '';
            let chatAvatarSrc = '';
            
            if (chatData.type === 'private' && otherUserData) {
                chatNameText = otherUserData.displayName || 'مستخدم';
                chatAvatarSrc = otherUserData.photoURL || '';
                chatStatus.textContent = otherUserData.status === 'online' ? '🟢 متصل' : '🔴 غير متصل';
                
                if (otherUserData.isVerified) {
                    verifiedBadge.style.display = 'inline-block';
                } else {
                    verifiedBadge.style.display = 'none';
                }
            } else if (chatData.type === 'group') {
                chatNameText = chatData.name || 'جروب';
                chatAvatarSrc = '👥';
                chatStatus.textContent = `👥 ${chatData.participants.length} أعضاء`;
                verifiedBadge.style.display = 'none';
            }
            
            chatName.textContent = chatNameText;
            chatAvatar.src = chatAvatarSrc || 'assets/images/default-avatar.png';
            
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            const activeItem = Array.from(document.querySelectorAll('.chat-item')).find(
                el => el.textContent.includes(chatNameText)
            );
            if (activeItem) activeItem.classList.add('active');
            
            loadMessages(chatId);
        }

        // ============================================================
        // 7. تحميل الرسائل (مع الشارة الزرقاء بجانب اسم المرسل)
        // ============================================================
        function loadMessages(chatId) {
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }

            const messagesRef = collection(db, 'chats', chatId, 'messages');
            const q = query(messagesRef, orderBy('timestamp', 'asc'));

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messagesArea.innerHTML = '';
                
                if (snapshot.empty) {
                    messagesArea.innerHTML = `
                        <div class="empty-chat">
                            💬 لا توجد رسائل بعد<br />
                            <small>كن أول من يكتب ✨</small>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((doc) => {
                    const msgData = doc.data();
                    const isOwn = msgData.senderId === currentUser.uid;
                    const isRead = msgData.readBy?.includes(currentUser.uid) || false;
                    const senderVerified = msgData.senderVerified || false;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isOwn ? 'own' : 'other'}`;
                    
                    let contentHTML = '';
                    if (msgData.type === 'text') {
                        contentHTML = `<div class="message-text">${msgData.text}</div>`;
                    } else if (msgData.type === 'image') {
                        contentHTML = `
                            <div class="message-media">
                                <img src="${msgData.fileUrl}" alt="صورة" class="message-image" />
                            </div>
                            ${msgData.caption ? `<div class="message-text">${msgData.caption}</div>` : ''}
                        `;
                    } else if (msgData.type === 'video') {
                        contentHTML = `
                            <div class="message-media">
                                <video src="${msgData.fileUrl}" controls class="message-video"></video>
                            </div>
                            ${msgData.caption ? `<div class="message-text">${msgData.caption}</div>` : ''}
                        `;
                    } else if (msgData.type === 'audio') {
                        contentHTML = `
                            <div class="message-media">
                                <audio src="${msgData.fileUrl}" controls class="message-audio"></audio>
                            </div>
                        `;
                    } else if (msgData.type === 'file') {
                        contentHTML = `
                            <div class="message-file">
                                <a href="${msgData.fileUrl}" target="_blank" class="file-link">
                                    📄 ${msgData.fileName}
                                </a>
                                <span class="file-size">${formatFileSize(msgData.fileSize)}</span>
                            </div>
                            ${msgData.caption ? `<div class="message-text">${msgData.caption}</div>` : ''}
                        `;
                    } else if (msgData.type === 'sticker') {
                        contentHTML = `
                            <div class="message-sticker">
                                <img src="${msgData.stickerUrl}" alt="${msgData.stickerName}" />
                            </div>
                        `;
                    }
                    
                    const senderName = isOwn ? 'أنت' : (msgData.senderName || 'مستخدم');
                    const verifiedBadgeHTML = senderVerified ? `<span class="verified-badge-message"></span>` : '';
                    
                    msgDiv.innerHTML = `
                        <div class="message-sender">
                            ${senderName} ${verifiedBadgeHTML}
                        </div>
                        ${contentHTML}
                        <div class="message-footer">
                            <span class="message-time">${formatTime(msgData.timestamp)}</span>
                            ${isOwn ? `<span class="message-status">${isRead ? '✓✓' : '✓'}</span>` : ''}
                        </div>
                    `;
                    
                    msgDiv.addEventListener('click', () => {
                        const text = msgData.text || msgData.caption || 'ملف';
                        if (confirm(`رد على "${text}"؟`)) {
                            messageInput.value = `رداً على "${text}"\n`;
                            messageInput.focus();
                        }
                    });
                    
                    msgDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if (isOwn) {
                            if (confirm('حذف هذه الرسالة؟')) {
                                deleteMessage(chatId, doc.id);
                            }
                        }
                    });
                    
                    messagesArea.appendChild(msgDiv);
                });
                
                messagesArea.scrollTop = messagesArea.scrollHeight;
                
                if (currentChatId) {
                    markMessagesAsRead(currentChatId);
                }
            });
        }

        // ============================================================
        // 8. إرسال رسالة (مع حفظ حالة التوثيق)
        // ============================================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentChatId || !currentUser) return;

            try {
                await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
                    type: 'text',
                    text: text,
                    senderId: currentUser.uid,
                    senderName: currentUserData.displayName || 'مستخدم',
                    senderVerified: currentUserData.isVerified || false,
                    timestamp: serverTimestamp(),
                    readBy: [currentUser.uid]
                });

                await updateDoc(doc(db, 'chats', currentChatId), {
                    lastMessage: text,
                    lastMessageTime: serverTimestamp()
                });

                messageInput.value = '';
                clearTyping();
            } catch (error) {
                console.error('❌ خطأ في الإرسال:', error);
                alert('فشل إرسال الرسالة');
            }
        }

        // ============================================================
        // 9. إرسال ملف (مع حفظ حالة التوثيق)
        // ============================================================
        async function sendFile(file, type) {
            if (!currentChatId || !currentUser) return;

            try {
                const fileRef = ref(storage, `chats/${currentChatId}/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(fileRef, file);
                const fileUrl = await getDownloadURL(snapshot.ref);
                
                const messageData = {
                    type: type,
                    senderId: currentUser.uid,
                    senderName: currentUserData.displayName || 'مستخدم',
                    senderVerified: currentUserData.isVerified || false,
                    timestamp: serverTimestamp(),
                    readBy: [currentUser.uid],
                    fileUrl: fileUrl,
                    fileName: file.name,
                    fileSize: file.size
                };

                if (type === 'image') {
                    messageData.caption = '';
                }

                await addDoc(collection(db, 'chats', currentChatId, 'messages'), messageData);

                await updateDoc(doc(db, 'chats', currentChatId), {
                    lastMessage: `📎 ${file.name}`,
                    lastMessageTime: serverTimestamp()
                });

                filePreviewModal.style.display = 'none';
                selectedFiles = [];

            } catch (error) {
                console.error('❌ خطأ في رفع الملف:', error);
                alert('فشل رفع الملف');
            }
        }

        // ============================================================
        // 10. إرفاق ملفات
        // ============================================================
        attachBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = 'image/*,video/*,audio/*,.pdf,.doc,.docx,.zip,.rar';
            
            input.onchange = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                selectedFiles = files;
                showFilePreview(files[0]);
            };
            
            input.click();
        });

        function showFilePreview(file) {
            const reader = new FileReader();
            
            filePreviewContent.innerHTML = '';
            
            if (file.type.startsWith('image/')) {
                reader.onload = (e) => {
                    filePreviewContent.innerHTML = `
                        <img src="${e.target.result}" class="preview-image" />
                        <p class="preview-name">${file.name}</p>
                        <p class="preview-size">${formatFileSize(file.size)}</p>
                    `;
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('video/')) {
                reader.onload = (e) => {
                    filePreviewContent.innerHTML = `
                        <video src="${e.target.result}" controls class="preview-video"></video>
                        <p class="preview-name">${file.name}</p>
                        <p class="preview-size">${formatFileSize(file.size)}</p>
                    `;
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('audio/')) {
                reader.onload = (e) => {
                    filePreviewContent.innerHTML = `
                        <audio src="${e.target.result}" controls class="preview-audio"></audio>
                        <p class="preview-name">${file.name}</p>
                        <p class="preview-size">${formatFileSize(file.size)}</p>
                    `;
                };
                reader.readAsDataURL(file);
            } else {
                filePreviewContent.innerHTML = `
                    <div class="preview-file-icon">📄</div>
                    <p class="preview-name">${file.name}</p>
                    <p class="preview-size">${formatFileSize(file.size)}</p>
                `;
            }
            
            filePreviewModal.style.display = 'flex';
        }

        sendFileBtn.addEventListener('click', () => {
            if (selectedFiles.length === 0) return;
            
            const file = selectedFiles[0];
            let type = 'file';
            
            if (file.type.startsWith('image/')) type = 'image';
            else if (file.type.startsWith('video/')) type = 'video';
            else if (file.type.startsWith('audio/')) type = 'audio';
            
            sendFile(file, type);
        });

        closePreviewBtn.addEventListener('click', () => {
            filePreviewModal.style.display = 'none';
            selectedFiles = [];
        });

        // ============================================================
        // 11. تسجيل صوتي
        // ============================================================
        voiceBtn.addEventListener('click', () => {
            voiceModal.style.display = 'flex';
            startRecordBtn.style.display = 'inline-block';
            stopRecordBtn.style.display = 'none';
            sendVoiceBtn.style.display = 'none';
            voiceTimer.textContent = '00:00';
            audioChunks = [];
        });

        startRecordBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    recordedAudio = new File([audioBlob], 'voice.webm', { type: 'audio/webm' });
                    
                    startRecordBtn.style.display = 'none';
                    stopRecordBtn.style.display = 'none';
                    sendVoiceBtn.style.display = 'inline-block';
                    
                    voiceWave.style.animation = 'none';
                };
                
                mediaRecorder.start();
                
                startRecordBtn.style.display = 'none';
                stopRecordBtn.style.display = 'inline-block';
                
                let seconds = 0;
                const timer = setInterval(() => {
                    seconds++;
                    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                    const secs = String(seconds % 60).padStart(2, '0');
                    voiceTimer.textContent = `${mins}:${secs}`;
                    
                    voiceWave.style.animation = 'voiceWave 0.5s infinite';
                }, 1000);
                
                stopRecordBtn._timer = timer;
                
            } catch (error) {
                console.error('❌ خطأ في التسجيل:', error);
                alert('⚠️ لا يمكن الوصول إلى الميكروفون');
            }
        });

        stopRecordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                clearInterval(stopRecordBtn._timer);
                voiceWave.style.animation = 'none';
                stopRecordBtn.style.display = 'none';
                sendVoiceBtn.style.display = 'inline-block';
            }
        });

        sendVoiceBtn.addEventListener('click', () => {
            if (recordedAudio) {
                sendFile(recordedAudio, 'audio');
                voiceModal.style.display = 'none';
                recordedAudio = null;
            }
        });

        closeVoiceBtn.addEventListener('click', () => {
            voiceModal.style.display = 'none';
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            recordedAudio = null;
        });

        // ============================================================
        // 12. الإيموجي
        // ============================================================
        window.insertEmoji = (emoji) => {
            messageInput.value += emoji;
            messageInput.focus();
        };

        let pickerInstance = null;
        
        emojiBtn.addEventListener('click', () => {
            if (emojiPickerContainer.style.display === 'none') {
                emojiPickerContainer.style.display = 'block';
                
                if (!pickerInstance) {
                    pickerInstance = new Picker({
                        data: 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1.18.0/data/ar.json'
                    });
                    
                    pickerInstance.addEventListener('emoji-click', (event) => {
                        messageInput.value += event.detail.unicode;
                        messageInput.focus();
                        emojiPickerContainer.style.display = 'none';
                    });
                    
                    emojiPicker.appendChild(pickerInstance);
                }
            } else {

            }
        });

        document.addEventListener('click', (e) => {
            if (!emojiPickerContainer.contains(e.target) && e.target !== emojiBtn) {
                emojiPickerContainer.style.display = 'none';
            }
        });

        // ============================================================
        // 13. نظام الملصقات
        // ============================================================

        const suggestedStickers = [
            { id: '1', url: 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1.18.0/data/emoji.json', name: 'ابتسامة' }
        ];

        stickerBtn.addEventListener('click', () => {
            stickerModal.style.display = 'flex';
            loadStickers('suggested');
        });

        async function loadStickers(tab) {
            stickerContent.innerHTML = '';
            
            document.querySelectorAll('.sticker-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.sticker-tab[data-tab="${tab}"]`)?.classList.add('active');
            
            let stickers = [];
            
            if (tab === 'suggested') {
                stickers = await getSuggestedStickers();
            } else if (tab === 'custom') {
                stickers = await getCustomStickers();
            } else if (tab === 'favorites') {
                stickers = await getFavoriteStickers();
            }
            
            if (stickers.length === 0) {
                stickerContent.innerHTML = `<div class="empty-chats">📭 لا توجد ملصقات</div>`;
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'sticker-grid';
            
            stickers.forEach(sticker => {
                const item = document.createElement('div');
                item.className = 'sticker-item';
                item.innerHTML = `<img src="${sticker.url}" alt="${sticker.name}" />`;
                
                item.addEventListener('click', () => {
                    sendSticker(sticker);
                    stickerModal.style.display = 'none';
                });
                
                grid.appendChild(item);
            });
            
            stickerContent.appendChild(grid);
        }

        async function getSuggestedStickers() {
            try {
                const snapshot = await getDocs(collection(db, 'stickers'));
                const stickers = [];
                snapshot.forEach(doc => {
                    stickers.push({ id: doc.id, ...doc.data() });
                });
                return stickers.length > 0 ? stickers : suggestedStickers;
            } catch (error) {
                return suggestedStickers;
            }
        }

        async function getCustomStickers() {
            if (!currentUser) return [];
            try {
                const q = query(
                    collection(db, 'stickers'),
                    where('createdBy', '==', currentUser.uid)
                );
                const snapshot = await getDocs(q);
                const stickers = [];
                snapshot.forEach(doc => {
                    stickers.push({ id: doc.id, ...doc.data() });
                });
                return stickers;
            } catch (error) {
                return [];
            }
        }

        async function getFavoriteStickers() {
            if (!currentUser) return [];
            try {
                const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
                const favoriteIds = userDoc.data()?.favoriteStickers || [];
                const stickers = [];
                for (const id of favoriteIds) {
                    const docSnap = await getDoc(doc(db, 'stickers', id));
                    if (docSnap.exists()) {
                        stickers.push({ id: docSnap.id, ...docSnap.data() });
                    }
                }
                return stickers;
            } catch (error) {
                return [];
            }
        }

        async function sendSticker(sticker) {
            if (!currentChatId || !currentUser) return;
            try {
                await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
                    type: 'sticker',
                    stickerUrl: sticker.url,
                    stickerName: sticker.name,
                    senderId: currentUser.uid,
                    senderName: currentUserData.displayName || 'مستخدم',
                    senderVerified: currentUserData.isVerified || false,
                    timestamp: serverTimestamp(),
                    readBy: [currentUser.uid]
                });
                await updateDoc(doc(db, 'chats', currentChatId), {
                    lastMessage: `📦 ملصق: ${sticker.name}`,
                    lastMessageTime: serverTimestamp()
                });
            } catch (error) {
                console.error('❌ خطأ في إرسال الملصق:', error);
            }
        }

        uploadStickerBtn.addEventListener('click', async () => {
            const file = stickerUploadInput.files[0];
            if (!file) {
                alert('⚠️ الرجاء اختيار صورة للملصق');
                return;
            }
            if (file.size > 500 * 1024) {
                alert('⚠️ حجم الصورة كبير جداً (الحد الأقصى 500KB)');
                return;
            }
            try {
                const stickerRef = ref(storage, `stickers/${Date.now()}_${file.name}`);
                await uploadBytes(stickerRef, file);
                const url = await getDownloadURL(stickerRef);
                await addDoc(collection(db, 'stickers'), {
                    url: url,
                    name: file.name.split('.')[0],
                    createdBy: currentUser.uid,
                    createdAt: serverTimestamp(),
                    type: 'custom'
                });
                alert('✅ تم رفع الملصق بنجاح!');
                stickerUploadInput.value = '';
                loadStickers('custom');
            } catch (error) {
                console.error('❌ خطأ في رفع الملصق:', error);
                alert('فشل رفع الملصق');
            }
        });

        closeStickerBtn.addEventListener('click', () => {
            stickerModal.style.display = 'none';
        });

        stickerModal.addEventListener('click', (e) => {

        });

        document.querySelectorAll('.color-option').forEach(el => {

        async function updateTypingStatus(chatId, typing) {

                await updateDoc(doc(db, 'chats', chatId), {

                });

        // ============================================================
        // 16. وضع علامة قراءة
        // ============================================================
        async function markMessagesAsRead(chatId) {
            try {
                const messagesRef = collection(db, 'chats', chatId, 'messages');
                const q = query(messagesRef, where('senderId', '!=', currentUser.uid));
                const snapshot = await getDocs(q);
                
                const batch = writeBatch(db);
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (!data.readBy || !data.readBy.includes(currentUser.uid)) {
                        batch.update(doc.ref, {
                            readBy: arrayUnion(currentUser.uid)
                        });
                    }
                });
                
                await batch.commit();
            } catch (error) {
                console.error('❌ خطأ في تحديث القراءة:', error);
            }
        }

        // ============================================================
        // 17. حذف رسالة
        // ============================================================
        async function deleteMessage(chatId, messageId) {
            try {
                await deleteDoc(doc(db, 'chats', chatId, 'messages', messageId));
            } catch (error) {
                console.error('❌ خطأ في حذف الرسالة:', error);
            }
        }

        // ============================================================
        // 18. بدء محادثة جديدة
        // ============================================================
        async function startPrivateChat(otherUserId) {
            if (!currentUser) return;

            try {
                const chatsRef = collection(db, 'chats');
                const q = query(
                    chatsRef,
                    where('participants', 'array-contains', currentUser.uid)
                );
                const snapshot = await getDocs(q);
                
                let existingChat = null;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.type === 'private' && data.participants.includes(otherUserId)) {
                        existingChat = doc.id;
                    }
                });

                if (existingChat) {
                    const chatDoc = await getDoc(doc(db, 'chats', existingChat));
                    const otherUserDoc = await getDoc(doc(db, 'users', otherUserId));
                    openChat(existingChat, chatDoc.data(), otherUserDoc.data());
                    return;
                }

                const newChatRef = await addDoc(collection(db, 'chats'), {
                    type: 'private',
                    participants: [currentUser.uid, otherUserId],
                    createdAt: serverTimestamp(),
                    lastMessage: '',
                    lastMessageTime: serverTimestamp()
                });

                const chatDoc = await getDoc(newChatRef);
                const otherUserDoc = await getDoc(doc(db, 'users', otherUserId));
                openChat(newChatRef.id, chatDoc.data(), otherUserDoc.data());

            } catch (error) {
                console.error('❌ خطأ في بدء المحادثة:', error);
                alert('فشل بدء المحادثة');
            }
        }

        // ============================================================
        // 19. إنشاء جروب
        // ============================================================
        async function createGroup() {
            const name = groupNameInput.value.trim();
            const members = groupMembersInput.value.split(',').map(s => s.trim()).filter(s => s);

            if (!name) {
                alert('⚠️ الرجاء إدخال اسم الجروب');
                return;
            }

            if (members.length < 2) {
                alert('⚠️ الرجاء إدخال عضوين على الأقل');
                return;
            }

            try {
                const memberIds = [];
                for (const member of members) {
                    const userQuery = query(
                        collection(db, 'users'),
                        where('phone', '==', member)
                    );
                    const snapshot = await getDocs(userQuery);
                    if (!snapshot.empty) {
                        memberIds.push(snapshot.docs[0].id);
                    } else {
                        alert(`⚠️ الرقم ${member} غير موجود`);
                        return;
                    }
                }

                if (!memberIds.includes(currentUser.uid)) {
                    memberIds.push(currentUser.uid);
                }

                await addDoc(collection(db, 'chats'), {
                    type: 'group',
                    name: name,
                    participants: memberIds,
                    admin: currentUser.uid,
                    createdAt: serverTimestamp(),
                    lastMessage: '',
                    lastMessageTime: serverTimestamp()
                });

                groupModal.style.display = 'none';
                groupNameInput.value = '';
                groupMembersInput.value = '';
                alert('✅ تم إنشاء الجروب بنجاح!');

            } catch (error) {
                console.error('❌ خطأ في إنشاء الجروب:', error);
                alert('فشل إنشاء الجروب');
            }
        }

        // ============================================================
        // 20. البحث عن مستخدمين
        // ============================================================
        searchInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const queryText = searchInput.value.trim();
                if (!queryText) return;

                const usersRef = collection(db, 'users');
                const q = query(
                    usersRef,
                    where('phone', '>=', queryText),
                    where('phone', '<=', queryText + '\uf8ff')
                );
                
                const snapshot = await getDocs(q);
                if (snapshot.empty) {
                    alert('❌ لا يوجد مستخدمين بهذا الرقم');
                    return;
                }

                const userDoc = snapshot.docs[0];
                const userData = userDoc.data();
                
                if (userDoc.id === currentUser.uid) {
                    alert('⚠️ هذا رقمك أنت!');
                    return;
                }

                const confirmStart = confirm(`بدء محادثة مع ${userData.displayName || 'مستخدم'}؟`);
                if (confirmStart) {
                    startPrivateChat(userDoc.id);
                }
            }
        });

        // ============================================================
        // 21. المكالمات
        // ============================================================
        callBtn.addEventListener('click', () => {
            if (!currentChatData) {
                alert('⚠️ اختر محادثة أولاً');
                return;
            }
            alert('📞 ميزة المكالمات الصوتية قريباً!');
        });

        videoCallBtn.addEventListener('click', () => {
            if (!currentChatData) {
                alert('⚠️ اختر محادثة أولاً');
                return;
            }
            alert('📹 ميزة المكالمات المرئية قريباً!');
        });

        // ============================================================
        // 22. قائمة خيارات المحادثة
        // ============================================================
        chatMenuBtn.addEventListener('click', () => {
            if (!currentChatData) {
                alert('⚠️ اختر محادثة أولاً');
                return;
            }
            
            const options = [
                '👤 عرض الملف الشخصي',
                '🔇 كتم الإشعارات',
                '🗑️ حذف المحادثة',
                '🚪 مغادرة الجروب'
            ];
            const choice = prompt(
                'اختر خياراً:\n' + options.map((o, i) => `${i+1}. ${o}`).join('\n')
            );
            if (choice) {
                const index = parseInt(choice) - 1;
                if (index === 0) {
                    alert('👤 عرض الملف الشخصي');
                } else if (index === 1) {
                    alert('🔇 تم كتم الإشعارات');
                } else if (index === 2) {
                    if (confirm('حذف هذه المحادثة؟')) {
                        deleteChat(currentChatId);
                    }
                } else if (index === 3) {
                    if (confirm('مغادرة الجروب؟')) {
                        leaveGroup(currentChatId);
                    }
                }
            }
        });

        async function deleteChat(chatId) {
            try {
                await deleteDoc(doc(db, 'chats', chatId));
                currentChatId = null;
                currentChatData = null;
                chatName.textContent = 'اختر محادثة';
                chatStatus.textContent = '🟢 متصل';
                messagesArea.innerHTML = `
                    <div class="empty-chat">💬 اختر محادثة لتبدأ الدردشة</div>
                `;
            } catch (error) {
                console.error('❌ خطأ في حذف المحادثة:', error);
                alert('فشل حذف المحادثة');
            }
        }

        async function leaveGroup(chatId) {
            try {
                await updateDoc(doc(db, 'chats', chatId), {
                    participants: arrayRemove(currentUser.uid)
                });
                currentChatId = null;
                currentChatData = null;
                chatName.textContent = 'اختر محادثة';
                messagesArea.innerHTML = `
                    <div class="empty-chat">💬 اختر محادثة لتبدأ الدردشة</div>
                `;
            } catch (error) {
                console.error('❌ خطأ في مغادرة الجروب:', error);
                alert('فشل مغادرة الجروب');
            }
        }

        // ============================================================
        // 23. المودال (إنشاء جروب)
        // ============================================================
        newGroupBtn.addEventListener('click', () => {
            groupModal.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            groupModal.style.display = 'none';
        });

        createGroupBtn.addEventListener('click', createGroup);

        groupModal.addEventListener('click', (e) => {
            if (e.target === groupModal) {
                groupModal.style.display = 'none';
            }
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.style.display = 'none';
            }
        });

        // ============================================================
        // 24. دوال مساعدة
        // ============================================================
        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(1) + ' GB';
        }

        // ============================================================
        // 25. ربط الأحداث
        // ============================================================
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
